<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Results</title>
</head>
<body>
  <h1>Matching Resources</h1>
  <div id="results">Loading...</div>

  <script>
    
    window.onload = function () {
      const params = new URLSearchParams(window.location.search);
      const location = params.get('location');
      const needs = params.get('needs')?.split(',') || [];

      console.log("Location:", location);
      console.log("Needs:", needs);

        document.getElementById('results').innerHTML = `
        <p><strong>Location:</strong> ${location}</p>
        <p><strong>Needs:</strong> ${needs.join(', ')}</p>
      `;

      // Example: fetch resources from your server
     fetch(`https://red-cross-disaster-resources.onrender.com/resources?location=${encodeURIComponent(location)}&needs=${encodeURIComponent(needs.join(','))}`)
        .then(res => res.json())
        .then(data => {
          if (data.length === 0) {
            document.getElementById('results').innerHTML += '<p>No results found.</p>';
          } else {
            const list = document.createElement('ul');
            data.forEach(item => {
              const li = document.createElement('li');
                  li.innerHTML = `
                    <strong>${item["Resource Name"]}</strong><br>
                   <strong>Description:</strong> ${item.Description || 'No description provided'}<br>
                  <strong>Phone:</strong> ${item["Phone Number"] || 'N/A'}<br>
                  <strong>Address:</strong> ${item.Address || 'N/A'}<br>
                  <strong>Hours:</strong> ${item.Hours || 'N/A'}<br>
                  <strong>Tags:</strong> ${item.Tags || 'N/A'}<br>
                <strong>Notes:</strong> ${item["Other notes "] || 'N/A'}<br>
                <strong>Last Updated:</strong> ${DateCovert(item["Date Updated"]) || 'N/A'}<br><br>
                  `;
              list.appendChild(li);
            });
    document.getElementById('results').appendChild(list);
  }
})
        .catch(err => {
          console.error(err);
          document.getElementById('results').innerHTML += '<p>Error loading resources.</p>';
        });
    };
    function DateCovert(serial) {
       var utc_days  = Math.floor(serial - 25570);
       var utc_value = utc_days * 86400;                                        
       var date_info = new Date(utc_value * 1000);
      return new Date(date_info.getFullYear(), date_info.getMonth(), date_info.getDate());
      }
  </script>
</body>
</html>
