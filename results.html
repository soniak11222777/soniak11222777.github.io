<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Results</title>
</head>
<body>
  <h1>Matching Resources</h1>
  <div id="results">Loading...</div>

  <script>
    window.onload = function () {
      const params = new URLSearchParams(window.location.search);
      const location = params.get('location');
      const needs = params.get('needs')?.split(',') || [];

      // Example of showing user input
      document.getElementById('results').innerHTML = `
        <p><strong>location:</strong> ${location}</p>
        <p><strong>needs:</strong> ${needs.join(', ')}</p>
      `;

      // Example: fetch resources from your server
      fetch(`http://localhost:3000/resources?location=${encodeURIComponent(location)}&needs=${encodeURIComponent(needs.join(','))}`)
        .then(res => res.json())
        .then(data => {
  if (data.length === 0) {
    document.getElementById('results').innerHTML += '<p>No results found.</p>';
  } else {
    const list = document.createElement('ul');
    data.forEach(item => {
      const li = document.createElement('li');
      li.innerHTML = `
        <strong>${item.Name}</strong><br>
        ${item.Description || 'No description provided'}<br>
        <strong>Phone:</strong> ${item.Phone || 'N/A'}<br>
        <strong>location:</strong> ${item.location || 'N/A'}<br>
        <strong>Type:</strong> ${item.ResourceType || 'N/A'}<br><br>
      `;
      list.appendChild(li);
    });
    document.getElementById('results').appendChild(list);
  }
})
        
        .catch(err => {
          console.error(err);
          document.getElementById('results').innerHTML += '<p>Error loading resources.</p>';
        });
    };
  </script>
</body>
</html>
