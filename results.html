<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Results</title>
</head>
<body>
  <h1>Matching Resources</h1>
  <div id="results">Loading...</div>

  <script>
    window.onload = function () {
      const params = new URLSearchParams(window.Location.search);
      const location = params.get('Location');
      const tags = params.get('Tags')?.split(',') || [];

      // Example of showing user input
      document.getElementById('results').innerHTML = `
        <p><strong>Location:</strong> ${location}</p>
        <p><strong>Tags:</strong> ${tags.join(', ')}</p>
      `;

      // Example: fetch resources from your server
      fetch(`http://localhost:3000/resources?location=${encodeURIComponent(location)}&tags=${encodeURIComponent(tags.join(','))}`)
        .then(res => res.json())
        .then(data => {
  if (data.length === 0) {
    document.getElementById('results').innerHTML += '<p>No results found.</p>';
  } else {
    const list = document.createElement('ul');
    data.forEach(item => {
      const li = document.createElement('li');
      li.innerHTML = `
  <strong>${item["Resource Name"]}</strong><br>
  ${item.Description || 'No description provided'}<br>
  <strong>Phone:</strong> ${item["Phone Number"] || 'N/A'}<br>
  <strong>Address:</strong> ${item.Address || 'N/A'}<br>
  <strong>Hours:</strong> ${item.Hours || 'N/A'}<br>
  <strong>Tags:</strong> ${item.Tags || 'N/A'}<br>
  <strong>Notes:</strong> ${item["Other notes "] || 'N/A'}<br>
  <strong>Last Updated:</strong> ${item["Date Updated"] || 'N/A'}<br><br>
`;
      list.appendChild(li);
    });
    document.getElementById('results').appendChild(list);
  }
})
        
        .catch(err => {
          console.error(err);
          document.getElementById('results').innerHTML += '<p>Error loading resources.</p>';
        });
    };
  </script>
</body>
</html>
