<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Red Cross Disaster Resources for Stanislaus and San Joaquin</title>

  <style>
    body {margin: 0;
            text-align: center;
            color: black;
        }
    .header {
            position: sticky;
            top: 0;
            background-color: #D9494BFF;
            padding: 20px;
            font-size: 28px;
            font-family: 'Impact', sans-serif;
        }
    .top-section {
            height: 50vh;
            display: flex;
            font-family:'Arial';
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #D9494BFF;
        }
      .dropdown {
          position: relative;
          display: inline-block;
      }
    .dropdown-content {
        display: none;
        position: absolute;
        background-color: #f9f9f9;
        min-width: 160px;
        box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.2);
        padding: 12px 16px;
        z-index: 1;
    }
.dropdown:hover .dropdown-content {
    display: block;
}

        h3 {
            font-size: 24px;
            margin-top: 15px;
        }
      
        
    </style>
</head>
  <body>

    <div class="header">Red Cross Disaster Resources for Stanislaus and San Joaquin</div>

    <div class="top-section">
        <h3>This is a database of resources in those counties that can be used for reference in a natural disaster or emergency. Use the drop-down menus to find specific resources tailored to your needs.</h3>
    </div>
      
    <div class="dropdown">
      <span>Location</span>
      <div class="dropdown-content">
        <p>San Joaquin</p>
        <p>Stanislaus</p>
  </div>
    
</div>
