<!DOCTYPE html>
<html lang="en"> 
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Red Cross Disaster Resources for Stanislaus and San Joaquin</title>
    <meta name="description" content="This is a database of resources in those counties that can be used for reference in a natural disaster or emergency. Use the drop-down menus to find resources tailored to your needs.">
  <style>
    body {
            margin: 0;
            text-align: center;
            color: black;
            font-size: 20px;
            min-height: 100 vh;
            font-family:'Arial';
            background-color: #D9494BFF;
        }
    .header {
            position: sticky;
            top: 0;
            color: white;
            padding: 20px;
            font-size: 35px;
            background-color: black;
            font-family: 'Impact', sans-serif;
            z-index: 10;
        }
        
    .top-section {
         padding: 40px 20px 20px;
        }
        
   .form-section {
      padding: 20px;
      max-width: 600px;
      margin: 0 auto;
    }
        
.custom-select {
	margin: 35px;
	min-width: 350px;
}

.custom-select select {
  appearance: none;
  width: 50%;
  font-size: 1.15rem;
  padding: 0.675em 6em 0.675em 1em;
  background-color: #fff;
  border: 1px solid #caced1;
  border-radius: 0.25rem;
  color: #000;
  cursor: pointer;
}
     
.container {
  display: block;
  position: relative;
  padding-left: 20px;
  top: 40px;
  margin-bottom: 12px;
  cursor: pointer;
  
  -webkit-user-select: none;
  -moz-user-select: none;
  -ms-user-select: none;
  user-select: none;
}

.container input {
  position: absolute;
  opacity: 0;
  cursor: pointer;
  height: 0;
  width: 0;
}

.checkmark {
  position: absolute;
  left: 85px;
  height: 25px;
  width: 25px;
  background-color: #eee;
}
      
.container input:checked ~ .checkmark {
  background-color: #2196F3;
}

.checkmark:after {
  content: "";
  position: absolute;
  display: none;
}

.container input:checked ~ .checkmark:after {
  display: block;
}

.container .checkmark:after {
  left: 9px;
  top: 5px;
  width: 5px;
  height: 10px;
  border: solid white;
  border-width: 0 3px 3px 0;
  -webkit-transform: rotate(45deg);
  -ms-transform: rotate(45deg);
  transform: rotate(45deg);
}  

 .navigation {
      margin-top: 70px;
      padding-bottom: 40px;
    }
    
  .navigation a {
      display: inline-block;
      padding: 10px 20px;
      text-decoration: none;
      border-radius: 5px;
      margin: 0 10px;
      font-size: 18px;
    }


.previous {

  background-color: #f1f1f1;
  color: black;
}

.next {
  background-color: #04AA6D;
  color: white;
}
        
    </style>
</head>
    
    <div class="header">Red Cross Disaster Resources for Stanislaus and San Joaquin</div>
<body>
    <div class="top-section">
        This is a database of resources in those counties that can be used for reference in a natural disaster or emergency. Use the drop-down menus to find specific resources tailored to your needs.
    </div>
    <div class="form-section">
  <div class="custom-select">
  <select>
    <option>Select a location</option>
    <option>San Joaquin</option>
    <option>Stanislaus</option>
  </select>
</div>

 <label class="container">Food
  <input type="checkbox">
  <span class="checkmark"></span>
</label>
<label class="container">Hygiene
  <input type="checkbox">
  <span class="checkmark"></span>
</label>
<label class="container">Shelter
  <input type="checkbox">
  <span class="checkmark"></span>
</label>
<label class="container">Clothing
  <input type="checkbox">
  <span class="checkmark"></span>
</label>  
<label class="container">Education/Wellness Programs
  <input type="checkbox">
  <span class="checkmark"></span>
</label>  
<label class="container">Transportation
  <input type="checkbox">
  <span class="checkmark"></span>
</label>  
<label class="container">Pet Assistance
  <input type="checkbox">
  <span class="checkmark"></span>
</label>  

 <div class="navigation">
      <a href="#" class="previous"> Previous</a>
      <a href="#" class="next">Go</a>
    </div>
  </div>
</div>
	
<script>
document.getElementById('search-form').addEventListener('submit', function(e) {
    e.preventDefault();

    const location = document.getElementById('location').value;

    // Collect all checked checkboxes into an array
    const checkboxes = document.querySelectorAll('input[name="need"]:checked');
    const needs = Array.from(checkboxes).map(cb => cb.value);

    // Create a query string (e.g., ?location=Chicago&needs=Food,Water)
    const queryString = `?location=${encodeURIComponent(location)}&needs=${encodeURIComponent(needs.join(','))}`;

    fetch(`http://localhost:3000/resources${queryString}`)
        .then(res => res.json())
        .then(data => {
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '';

            if (data.length === 0) {
                resultsDiv.innerHTML = 'No resources found.';
            } else {
                data.forEach(item => {
                    const div = document.createElement('div');
                    div.textContent = `${item.Name} - ${item.Contact}`;
                    resultsDiv.appendChild(div);
                });
            }
        });
});
</script>
	
</body>
</html>
